<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instagram Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/app.js?v=3" defer></script>
</head>
<body class="min-h-screen" style="font-family: 'Inter', sans-serif;">
  <div id="app"></div>

  <div id="toast" style="position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999;" class="hidden rounded-full px-5 py-3 text-sm font-semibold text-white shadow-lg"></div>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lb-close" aria-label="Close media viewer">✕</button>
    <button class="lb-prev" aria-label="Previous media">‹</button>
    <div class="lb-stage">
      <div class="lb-media"></div>
      <div class="lb-caption"></div>
    </div>
    <button class="lb-next" aria-label="Next media">›</button>
  </div>

  <script src="/app.js?v=3" defer></script>
</body>
</html>
